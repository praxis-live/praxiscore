# Array commands
array.description=array <values...>\n\nCreate array from values.
array-contains.description=array-contains <array> <value>\n\nCheck if the array \
contains the provided value.
array-get.description=array-get <array> <index>\n\nGet the array value at the \
specified index. This command will wrap out of bounds indices to return a value.
array-join.description=array-join <arrays...>\n\nConcatenate values from multiple \
arrays into a single array.
array-range.description=array-range <array> <start> <end>?\n\nReturn an array \
containing the values within the provided range.
array-size.description=array-size <array>\n\nQuery the size of an array.
explode.description=explode <arrays...>\n\nExplode arrays into a flattened list \
of values.
foreach.description=foreach <variables> in <array> {script}\n\n\
Execute the provided script for each set of variables in the provided array. The \
variables parameter is an array, and consecutive values from the provided array \
can be accessed using the variable names. The array size must be a multiple of the \
variable array size.
range.description=range <start>? <end> <step>?\n\nGenerate an array containing \
numbers from start to end, going up by step. The default start is zero. The default \
step is one.

# At commands
at.description=@ <address> <component-type>? {script}?\n\n\
Run a script within the context of an component address, after optionally creating \
it. The command will fail if a component type is provided and the component already \
exists, unless evaluated under trap errors.
not-at.description=!@ <address>\n\nRemove the component at the provided address.

# Base commands
set.description=set <name> <value>\n\nSet the named variable to the provided value. \
If no variable with that name exists, one will be created in the current namespace. \
Returns the value.
is-set.description=is-set <name>\n\nCheck whether a variable with that name is set.
get.description=get <name>\n\nGet the value of the named variable. Programmatic \
equivalent to $name useful in some cases.
constant.description=constant <name> <value>\n\nCreate a constant with the provided \
name and value in the current namespace. Returns the value.
var.description=var <name> <value>\n\nCreate a variable with the provided name and \
value in the current namespace. Returns the value.
echo.description=echo <values>...\n\nReturn the values concatenated into a single \
string, or the provided value if only one.
print.description=print <value>\n\nReturn the value as text formatted for reading.

# Connect commands
connect.description=~ <port1> <port2>\n\nConnect two ports.
disconnect.description=!~ <port1> <port2>\n\nDisconnect two ports.

# File commands
file.description=file <path>\n\nResolve a file path against the current working \
directory.
file-list.description=file-list <glob>?\n\nList files in the current working \
directory, filtering by the optional glob pattern.
cd.description=cd <path>\n\nChange the working directory.
load.description=load <path>\n\nLoad text from the provided file.
ls.description=ls <glob>?\n\nList file names in the current working directory \
filtering by the optional glob pattern.
pwd.description=pwd\n\nReturn the current working directory.

# IO commands
user-input.description=user-input <message> <suggested-value>? <value-info>?\n\n\
Request input from the user with the provided message and optional suggested value. \
Returns the text input by the user, or an error if cancelled.
user-input-confirm.description=user-input-confirm <message>\n\n\
Request the user answer the provided message with yes or no. Returns true for yes, \
false for no, or error if cancelled.
user-input-map.description=user-input-map <message> <values-map>\n\n\
Request the user rewrite the values of the provided map. Returns the rewritten \
map, or error if cancelled.
user-input-select.description=user-input-select <message> <values-array>\n\n\
Request the user select a value from the provided array of values. Returns the \
selected value, or error if cancelled.

# Info commands
info.description=info commands|<command>|<address>\n\nReturn readable information \
about available commands, an individual command, or a component, control or port.

# Java commands
jcall.description=jcall <class> <method|signature> <args...>\n\n\
Experimental support for calling Java methods in the JVM running the script \
intepreter. The class argument is the name of the class holding the method. The \
method argument is an array containing the method name, and optionally parameter \
type information for matching the right method. If an instance method, the first \
argument should be a reference to or convertible to an object of the relevant \
instance. The return will be converted back to a core type or a reference holder.
sys-env.description=sys-env <key>\n\nGet the value of an environment variable, \
or an empty string if not set.
sys-prop.description=sys-prop <key> <value>?\n\n\Set or get the value of a system \
property. An empty string is returned if the property is not set. If a new value \
is provided, the system property is set and any previous value is returned.

# Map commands
map.description=map <key>? <value>?...\n\nCreate a map out of a list of keys and \
values.
map-get.description=map-get <map> <key>\n\nRetrieve a value from a map.
map-keys.description=map-keys <map>\n\nRetrieve the keys of a map.
map-size.description=map-size <map>\n\nQuery the size of a map.

# Op commands
add.description=+ <values...>\n\nSum the provided values.
equivalent.description=\=\= <value1> <value2>\n\nTest if two values are equivalent.
not-equivalent.description=!\= <value1> <value2>\n\nTest if two values are not equivalent.
multiply.description=* <values...>\n\nMultiply the provided values.

# Process commands
exec.description=exec <command> <args...>\n\nExecute an external command and return \
its output.

# Script commands
eval.description=eval --inline? --trap-errors? <--allowed-commands array>? <script>\n\n \
Evaluate a Pcl script. Script execution happens in a child namespace unless \
marked as inline. The list of commands may be filtered. Errors may be trapped, \
allowing execution to continue from the next line. Allowed commands must be specified \
when trapping errors.
global.description=global <script>\n\nExecute a script in the global namespace.
if.description=if <boolean> {script1} else? {script2}?\n\nTest a value. If true \
execute the provided script1, or else execute the optional script2.
include.description=include <file>\n\nLoad a script from a file and evaluate.
function.description=function <name> <parameters> {body}\n\nDefine a user function \
with the provided name. The body script will be evaluated when the function is \
called. The parameters is an array of variable names that will be assigned from \
the arguments when the function is called.
user-function.description={0} {1}\n\nUser defined function.
try.description=try {script} catch? {on-error-script}?\n\nEvaluate the script, \
catching any errors. Optionally runs the provided catch script on error. The $ERROR \
variable is available inside the catch script. Returns the value from the successful \
or catch script.
fail.description=fail <message>?\n\nFail execution with the provided error message.

# String commands
string-contains.description=string-contains <string> <text>\n\nTest whether a \
string contains the provided text.
string-join.description=string-join <array> <delimiter>? <prefix>? <suffix>?\n\n\
Concatenate an array of values into a single string, separated by the provided \
delimiter, starting with the optional prefix, and ending with the optional suffix.
string-matches.description=string-matches <string> <regex>\n\nTest whether a \
string matches the provided regular expression.
string-split.description=string-split <string> <regex>\n\nSplit a string around \
matches of the provided regular expression and return the result as an array.

# System commands
edit.description=edit <property_address>\n\nEdit the value of a property control.
exit.description=exit <errorcode>?\n\nExit system, with optional error code.
log.description=log <ERROR|WARNING|INFO|DEBUG>? <message>\n\nLog the message at \
the provided level.
roots.description=roots --all?\n\nList the roots in the hub. Filters out system \
roots unless --all is passed.
