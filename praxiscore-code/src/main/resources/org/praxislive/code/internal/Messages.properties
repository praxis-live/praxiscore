compiler.description=compiler <configuration-map>?\n\nConfigure the compiler from \
the provided configuration map (if provided), and return the current configuration. \
Use {release java-version} to configure the Java API to compile against.
libraries.description=libraries <libraries-array>?\n\nAdd the libraries from the \
array (if provided), and return the list of user added libraries.
libraries-all.description=libraries-all\n\nReturn a list of all added libraries, \
including dependencies.
libraries-system.description=libraries-system\n\nReturn a list of all libraries \
provided by the CORE system.
libraries-path.description=libraries-path\n\nReturn a list of all files corresponding \
to all added libraries.
shared-code.description=shared-code <sources-map>\n\nSet the shared code on the \
root of the current component context.
shared-code-add.description=shared-code-add <sources-map>\n\nAdd to the shared code \
on the root of the current component context. Code of existing classes is unmodified.
shared-code-merge.description=shared-code-merge <sources-map>\n\nMerge with the shared \
code on the root of the current component context. Code of existing classes will \
be overwritten.
sources.description=sources <path>\n\nRead Java sources from disk into a map, suitable \
for passing to shared-code.
sources-write.description=sources-write <sources-map> <path>\n\nWrite a sources map \
to disk, rooted at the provided path. Existing files will not be overwritten. A \
warning will be logged if an existing file's contents doesn't match the map.

existing-file-mismatch=File {0} already exists with different content.
java-release.deprecation=java-release <value> is deprecated for removal, use \
compiler {release <value>}.
